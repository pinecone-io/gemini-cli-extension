name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate extension (json / python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate JSON files
        run: |
          find . -name '*.json' -not -path './.git/*' -print0 \
            | xargs -0 -n1 -I{} sh -c 'python -c "import json,sys; json.load(open(sys.argv[1]))" "$1" && echo "OK $1"' _ {}

      - name: Byte-compile Python scripts
        run: python -m compileall -q skills

      - name: Lint Python scripts (ruff, error-level)
        run: |
          python -m pip install --upgrade pip ruff
          ruff check --select E9,F63,F7,F82 skills
